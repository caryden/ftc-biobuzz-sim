[workspace]
resolver = "2"
members = ["crates/render", "crates/app"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
bench-render = { path = "crates/render" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
glam = "0.29"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Zed main as of 2026-10-22, a rev known to build on macOS and Linux.
gpui = { git = "https://github.com/zed-industries/zed", rev = "9e84b066b55bc3609a30dd965075c12255b38b45" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "9e84b066b55bc3609a30dd965075c12255b38b45", features = ["font-kit", "wayland", "x11"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
